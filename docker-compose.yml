version: '3'

networks:
  aiclinic-net:
    external: true
    name: aiclinic-net

services:
  webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webserver
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MONGODB_URI=mongodb://mongodb:27017/aiclinic
      - AISERVER_URI=http://ai_server:8000
      - ORTHANC_SERVER_URL=http://orthanc:8042
      - AUTH_SERVER_URL=http://webserverauth:8001
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./dicom_files:/app/dicom_files
      - ./waveform_results:/app/waveform_results
    restart: unless-stopped
    networks:
      - aiclinic-net

  webserverauth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webserverauth
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - MONGODB_URI=mongodb://mongodb:27017/aiclinic
      - AISERVER_URI=http://ai_server:8000
      - ORTHANC_SERVER_URL=http://orthanc:8042
      - AUTH_SERVER_URL=http://webserverauth:8001
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./dicom_files:/app/dicom_files
      - ./waveform_results:/app/waveform_results
    restart: unless-stopped
    networks:
      - aiclinic-net
